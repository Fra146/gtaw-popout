name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path version.py -Value "APP_VERSION = `"$ver`""

      - name: Build single-file Windows executable
        run: |
          python -m PyInstaller --clean --noconfirm build-windows.spec

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\GTAW-Tactical-Launcher.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\GTAW-Tactical-Launcher.exe.sha256 -Value "$hash  GTAW-Tactical-Launcher.exe" -NoNewline

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTAW-Tactical-Launcher-windows
          path: |
            dist/GTAW-Tactical-Launcher.exe
            dist/GTAW-Tactical-Launcher.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GTAW-Tactical-Launcher.exe
            dist/GTAW-Tactical-Launcher.exe.sha256
          generate_release_notes: true

      - name: Publish GitHub Release (latest)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            dist/GTAW-Tactical-Launcher.exe
            dist/GTAW-Tactical-Launcher.exe.sha256
