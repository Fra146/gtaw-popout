name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file Windows executable
        run: |
          python -m PyInstaller --clean --noconfirm build-windows.spec

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTAW-Tactical-Launcher-windows
          path: dist/GTAW-Tactical-Launcher.exe
          if-no-files-found: error

      - name: Attach to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GTAW-Tactical-Launcher.exe
