<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tactical Popout</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b !important;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #nui-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #05070b !important;
    }
    #nui-root {
      transform-origin: center center;
    }
    #nui-root [data-tactical-wrapper="1"] {
      position: static !important;
      width: auto !important;
      height: auto !important;
      inset: auto !important;
      transform: none !important;
    }
    #nui-root [data-tactical-target="1"] {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      transform: none !important;
      margin: 0 !important;
    }
    #nui-stage.mode-fill #nui-root,
    #nui-stage.mode-fill [data-tactical-wrapper="1"] {
      width: 100vw !important;
      height: 100vh !important;
    }
    #nui-stage.mode-fill [data-tactical-target="1"] {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
    }
    @font-face {
      font-family: 'Seg-7';
      src: url('/static/fonts/Segment7Standard.otf') format('opentype');
    }
    #nui-root #radarFrame .ghost_speed,
    #nui-root #radarFrame .speed,
    #nui-root #radarFrame .fast_ghost_speed,
    #nui-root #radarFrame .fast_speed,
    #nui-root #radarFrame .patrol_ghost_speed,
    #nui-root #radarFrame .patrol_speed {
      font-family: 'Seg-7', 'Share Tech Mono', ui-monospace, monospace !important;
    }
    #standby-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(5, 7, 11, 0.92);
      z-index: 9999;
      text-align: center;
      padding: 24px;
    }
    #standby-overlay.hidden {
      display: none;
    }
    .status-pill {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #1c2433;
      border: 1px solid #2d384d;
      color: #f59e0b;
    }
    .status-pill.disconnected {
      color: #ef4444;
    }
    .selector-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #8b949e;
    }
    #launch-btn {
      cursor: pointer;
      padding: 9px 18px;
      border-radius: 6px;
      border: 1px solid #3b82f6;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    #launch-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #launch-btn.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="nui-styles"></div>
  <div id="nui-stage">
    <div id="nui-root"></div>
  </div>

  <div id="standby-overlay">
    <div id="status-pill" class="status-pill">STANDBY</div>
    <div id="status-text">Waiting for NUI element...</div>
    <div id="selector-label" class="selector-label"></div>
    <button id="launch-btn" class="hidden">Launch in Game</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const selector = params.get('selector') || '#bezel';
    const allowedModes = ['fill', 'fit-width', 'contain', 'natural'];
    const rawMode = params.get('mode');
    const mode = allowedModes.includes(rawMode) ? rawMode : 'fill';
    const hide = params.get('hide') !== 'false';
    const canLaunch = params.get('can_launch') === 'true';
    const openCommand = params.get('command') || null;

    document.title = `Popout — ${selector}`;
    document.getElementById('selector-label').textContent = selector;

    const stage = document.getElementById('nui-stage');
    const nuiRoot = document.getElementById('nui-root');
    const nuiStyles = document.getElementById('nui-styles');
    const overlay = document.getElementById('standby-overlay');
    const statusPill = document.getElementById('status-pill');
    const statusText = document.getElementById('status-text');
    const launchBtn = document.getElementById('launch-btn');

    stage.classList.add(`mode-${mode}`);
    if (canLaunch) {
      launchBtn.classList.remove('hidden');
    }

    let ws = null;
    let lastStylesKey = '';
    let lastHtml = '';

    function buildChildPath(target, root) {
      const targetRoot = root.querySelector('[data-tactical-target="1"]') || root;
      if (!target || target === targetRoot || target === root) return null;
      const parts = [];
      let cur = target;
      while (cur && cur !== targetRoot && cur !== root && cur.parentElement) {
        const parent = cur.parentElement;
        const idx = Array.prototype.indexOf.call(parent.children, cur) + 1;
        parts.unshift(`${cur.tagName.toLowerCase()}:nth-child(${idx})`);
        cur = parent;
      }
      return parts.join(' > ') || null;
    }

    function fitStage() {
      if (mode === 'fill' || mode === 'natural') {
        nuiRoot.style.transform = '';
        return;
      }
      const target = nuiRoot.querySelector('[data-tactical-target="1"]') || nuiRoot.firstElementChild;
      if (!target) return;
      const w = target.offsetWidth || target.getBoundingClientRect().width;
      const h = target.offsetHeight || target.getBoundingClientRect().height;
      if (w > 0 && h > 0) {
        const scale = mode === 'fit-width'
          ? (stage.clientWidth / w)
          : Math.min(stage.clientWidth / w, stage.clientHeight / h);
        nuiRoot.style.transform = `scale(${scale})`;
      }
    }
    window.addEventListener('resize', fitStage);
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(fitStage);
      ro.observe(stage);
      ro.observe(nuiRoot);
    }

    function applyStyles(styles) {
      const list = Array.isArray(styles) ? styles : [];
      const key = list.join('\n/*---*/\n');
      if (key === lastStylesKey) return;
      lastStylesKey = key;
      nuiStyles.innerHTML = '';
      for (const css of list) {
        const st = document.createElement('style');
        st.textContent = css;
        nuiStyles.appendChild(st);
      }
    }

    async function decodeCanvases(canvases) {
      const bitmaps = {};
      if (!canvases) return bitmaps;
      await Promise.all(
        Object.entries(canvases).map(async ([cid, dataUrl]) => {
          if (!dataUrl) return;
          try {
            const resp = await fetch(dataUrl);
            const blob = await resp.blob();
            bitmaps[cid] = await createImageBitmap(blob);
          } catch (_) {}
        })
      );
      return bitmaps;
    }

    function paintCanvases(bitmaps) {
      for (const [cid, bitmap] of Object.entries(bitmaps)) {
        const canvas = nuiRoot.querySelector(`canvas[data-tactical-canvas-id="${cid}"]`);
        if (canvas) {
          const ctx = canvas.getContext('2d');
          if (ctx) {
            if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
              canvas.width = bitmap.width;
              canvas.height = bitmap.height;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          }
        }
        bitmap.close();
      }
    }

    function showOverlay(state, text) {
      overlay.classList.remove('hidden');
      statusPill.textContent = state;
      statusPill.classList.toggle('disconnected', state === 'DISCONNECTED');
      statusText.textContent = text;
      launchBtn.classList.toggle('hidden', !canLaunch || state !== 'STANDBY');
    }

    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const qs = new URLSearchParams({ selector, hide: String(hide) });
      ws = new WebSocket(`${proto}//${location.host}/ws/nui?${qs.toString()}`);

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.state === 'ACTIVE') {
          const bitmaps = await decodeCanvases(msg.canvases);
          overlay.classList.add('hidden');
          applyStyles(msg.styles);
          if (msg.html && msg.html !== lastHtml) {
            const animTimes = new Map();
            for (const anim of nuiRoot.getAnimations ? nuiRoot.getAnimations({ subtree: true }) : []) {
              const target = anim.effect && anim.effect.target;
              if (target && target.id && anim.currentTime != null) {
                animTimes.set(target.id, anim.currentTime);
              }
            }
            lastHtml = msg.html;
            nuiRoot.innerHTML = msg.html;
            for (const anim of nuiRoot.getAnimations ? nuiRoot.getAnimations({ subtree: true }) : []) {
              const target = anim.effect && anim.effect.target;
              if (target && target.id && animTimes.has(target.id)) {
                anim.currentTime = animTimes.get(target.id);
              }
            }
            fitStage();
            requestAnimationFrame(fitStage);
            setTimeout(fitStage, 50);
          }
          paintCanvases(bitmaps);
        } else if (msg.state === 'DISCONNECTED') {
          showOverlay('DISCONNECTED', 'FiveM CDP offline (127.0.0.1:13172)');
        } else {
          showOverlay('STANDBY', 'Element unmounted in game');
        }
      };

      ws.onclose = () => {
        showOverlay('DISCONNECTED', 'Reconnecting to Tactical Hub...');
        setTimeout(connectWs, 1500);
      };
    }

    nuiRoot.addEventListener('mousedown', (event) => {
      if (event.button !== 0) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const childPath = buildChildPath(event.target, nuiRoot);
      ws.send(JSON.stringify({ type: 'click', child_path: childPath }));
    });

    launchBtn.addEventListener('click', async () => {
      launchBtn.disabled = true;
      try {
        await fetch('/api/launch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selector, command: openCommand }),
        });
      } finally {
        setTimeout(() => { launchBtn.disabled = false; }, 5000);
      }
    });

    connectWs();
  </script>
</body>
</html>
